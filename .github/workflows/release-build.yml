name: Release Compilation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Compile macOS Application
        run: |
          pyinstaller --noconfirm --noconsole --onefile --windowed --name=ALP_Terminal_Mac --collect-all webview alp.py

      - name: Package Mac App into DMG Installer
        run: |
          brew install create-dmg
          create-dmg \
            --volname "ALP Terminal Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ALP_Terminal_Mac.app" 150 190 \
            --hide-extension "ALP_Terminal_Mac.app" \
            --app-drop-link 450 190 \
            "dist/ALP_Mac_Installer.dmg" \
            "dist/ALP_Terminal_Mac.app" || test -f "dist/ALP_Mac_Installer.dmg" || {
              echo "create-dmg AppleScript notice: using native hdiutil to complete DMG packaging..."
              mkdir -p dist/dmg_staging
              cp -R "dist/ALP_Terminal_Mac.app" dist/dmg_staging/
              ln -s /Applications dist/dmg_staging/Applications
              hdiutil create -volname "ALP Terminal Installer" -srcfolder dist/dmg_staging -ov -format UDZO "dist/ALP_Mac_Installer.dmg"
            }

      - name: Upload macOS Application to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/ALP_Mac_Installer.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pythonnet

      - name: Compile Windows Executable
        run: |
          if (Test-Path "assets/alp.ico") {
            pyinstaller --noconfirm --noconsole --onefile --icon=assets/alp.ico --name=ALP_Terminal_Win64 --collect-all webview alp.py
          } else {
            pyinstaller --noconfirm --noconsole --onefile --name=ALP_Terminal_Win64 --collect-all webview alp.py
          }

      - name: Build Windows Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows Binary to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/ALP_Setup_Win64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
